# Install only after api.zecone.xyz and access-api.zecone.xyz resolve to this
# host. Certbot adds the reviewed TLS listeners after the HTTP routes validate.
server {
    listen 80;
    listen [::]:80;
    server_name api.zecone.xyz;

    location / {
        proxy_pass http://127.0.0.1:4321;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name access-api.zecone.xyz;

    location / {
        proxy_pass http://127.0.0.1:4333;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }
}
