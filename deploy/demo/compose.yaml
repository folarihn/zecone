name: zecone-demo
services:
  payments:
    build:
      context: ../..
      dockerfile: deploy/demo/Dockerfile
    command: ["services/payments/server.ts"]
    env_file:
      - ${ZECONE_DEMO_ENV_FILE:-../../.secrets/deployment/demo.env}
    environment:
      NODE_ENV: production
      ZECONE_PAYMENTS_HOST: 0.0.0.0
      ZECONE_PAYMENTS_PORT: "4321"
      ZECONE_PAYMENTS_DB: /var/lib/zecone/payments/payments.sqlite
      ZECONE_PAYMENTS_MODE: demo
      ZECONE_PUBLIC_URL: https://${ZECONE_WEB_DOMAIN:?set ZECONE_WEB_DOMAIN}
      ZECONE_SIWE_DOMAINS: ${ZECONE_WEB_DOMAIN},${ACCESS_PASS_DOMAIN:?set ACCESS_PASS_DOMAIN}
      ZECONE_ALLOW_HTTP_WEBHOOKS: "0"
      ZECONE_OPERATOR_TOKEN: ""
      ZECONE_TRUST_PROXY: "1"
      ZECONE_DEMO_OBSERVER: "1"
    volumes:
      - payments-data:/var/lib/zecone/payments
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4321/api/v1/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: &logging
      driver: local
      options: { max-size: 10m, max-file: "5" }

  access-pass:
    build:
      context: ../..
      dockerfile: deploy/demo/Dockerfile
    command: ["examples/access-pass/server.ts"]
    env_file:
      - ${ZECONE_DEMO_ENV_FILE:-../../.secrets/deployment/demo.env}
    environment:
      NODE_ENV: production
      ACCESS_PASS_HOST: 0.0.0.0
      ACCESS_PASS_PORT: "4333"
      ACCESS_PASS_STATE: /var/lib/zecone/access-pass/state.json
      ACCESS_PASS_PUBLIC_URL: https://${ACCESS_PASS_DOMAIN}
      ACCESS_PASS_BACKEND_URL: https://${ACCESS_PASS_API_DOMAIN:?set ACCESS_PASS_API_DOMAIN}
      ZECONE_BASE_URL: http://payments:4321
      ZECONE_WEB_URL: https://${ZECONE_WEB_DOMAIN}
    depends_on:
      payments: { condition: service_healthy }
    volumes:
      - access-pass-data:/var/lib/zecone/access-pass
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4333/healthz').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *logging

  caddy:
    image: caddy:2.10.2-alpine
    environment:
      ZECONE_API_DOMAIN: ${ZECONE_API_DOMAIN:?set ZECONE_API_DOMAIN}
      ACCESS_PASS_API_DOMAIN: ${ACCESS_PASS_API_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    read_only: true
    tmpfs: [/tmp, /run]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    depends_on:
      payments: { condition: service_healthy }
      access-pass: { condition: service_healthy }
    logging: *logging

volumes:
  payments-data:
  access-pass-data:
  caddy-data:
  caddy-config:
