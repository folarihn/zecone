[package]
name = "zecone-zcash-watch"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

# Independent from the legacy funded wallet and the network-free refund signer.
[workspace]

[dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
rand = "=0.10.3"
rusqlite = { version = "=0.37.0", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tonic = { version = "0.14", features = ["tls-webpki-roots"] }
zcash_client_backend = { version = "=0.25.0-pre.1", features = ["sync", "lightwalletd-tonic-transport", "lightwalletd-tonic-tls-webpki-roots", "orchard", "pczt"] }
zcash_client_sqlite = { version = "=0.23.0-pre.1", features = ["transparent-inputs", "serde"] }
zcash_keys = { version = "=0.17.0-pre.1", features = ["sapling", "orchard"] }
zcash_protocol = "=0.11.0-pre.0"
zcash_primitives = "=0.31.0-pre.1"
zeroize = "1"

[dev-dependencies]
tempfile = "3"
