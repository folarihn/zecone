[package]
name = "zecone-zcash-mainnet-spend"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

# Dedicated mainnet spending wallet. Keeps spending authority isolated from the
# watch-only `zecone-zcash-watch` service and unchanged from the legacy testnet
# `zecone-zcash` funded wallet. Feature set matches zcash-watch so the derived
# unified UFVK and account fingerprint are identical.
[workspace]

[dependencies]
aes-gcm = "0.10"
anyhow = "1"
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
rand = "=0.10.3"
rand08 = { package = "rand", version = "0.8" }
rusqlite = { version = "=0.37.0", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
scrypt = "0.11"
secrecy = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tonic = { version = "0.14", features = ["tls-webpki-roots"] }
uuid = "1"
zeroize = "1"
zcash_address = "=0.14.0-pre.1"
zcash_client_backend = { version = "=0.25.0-pre.1", features = ["sync", "lightwalletd-tonic-transport", "lightwalletd-tonic-tls-webpki-roots", "orchard", "pczt"] }
zcash_client_sqlite = { version = "=0.23.0-pre.1", features = ["transparent-inputs", "serde"] }
zcash_keys = { version = "=0.17.0-pre.1", features = ["sapling", "orchard"] }
zcash_primitives = "=0.31.0-pre.1"
zcash_proofs = { version = "=0.31.0-pre.1", features = ["bundled-prover"] }
zcash_protocol = "=0.11.0-pre.0"
zip321 = "=0.10.0-pre.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }

[dev-dependencies]
