[package]
name = "zecone-zcash"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
rand = "0.8"
rand10 = { package = "rand", version = "0.10" }
rusqlite = { version = "=0.37.0", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
secrecy = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tonic = { version = "0.14", features = ["tls-webpki-roots"] }
uuid = "1"
zcash_address = "=0.14.0-pre.1"
zcash_client_backend = { version = "=0.25.0-pre.1", features = ["sync", "lightwalletd-tonic-transport", "lightwalletd-tonic-tls-webpki-roots", "orchard"] }
zcash_client_sqlite = "=0.23.0-pre.1"
zcash_keys = { version = "=0.17.0-pre.1", features = ["sapling", "orchard"] }
zcash_primitives = "=0.31.0-pre.1"
zcash_proofs = { version = "=0.31.0-pre.1", features = ["bundled-prover"] }
zcash_protocol = "=0.11.0-pre.0"
zip321 = "=0.10.0-pre.1"

[dev-dependencies]
tempfile = "3"
